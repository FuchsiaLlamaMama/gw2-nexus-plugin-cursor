# Publishes a GitHub Release when a version tag (vMAJOR.MINOR.PATCH) is pushed.
# Nexus auto-updates from these releases: it picks the highest version tag and
# downloads the release's first .dll asset, so each release carries exactly one
# .dll (cursor.dll) and the tag must match the version compiled into the addon.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the tag matches the addon version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -oE 'AddonVersion_t\{ *[0-9]+, *[0-9]+, *[0-9]+' src/entry.cpp \
                | grep -oE '[0-9]+' | tr '\n' '.' | sed 's/\.$//')
          echo "tag: $tag  addon version: $ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match the addon version $ver in src/entry.cpp"
            exit 1
          fi

      - name: Configure (x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Test (cursor-core, doctest via ctest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish the release with cursor.dll
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dll=$(find build -name cursor.dll -path '*Release*' | head -n 1)
          if [ -z "$dll" ]; then echo "::error::cursor.dll not found"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" "$dll" \
            --title "Cursor Finder $GITHUB_REF_NAME" \
            --generate-notes
