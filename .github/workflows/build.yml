# Builds Cursor Finder on Windows (MSVC + CMake, x64) on every push and pull
# request, runs the unit tests, and uploads cursor-finder.dll as an artifact.
name: build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Test (cursor-finder-core, doctest via ctest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload cursor-finder.dll
        uses: actions/upload-artifact@v4
        with:
          name: cursor-finder-dll
          path: build/**/cursor-finder.dll
          if-no-files-found: error
