<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Soft Halo's design accent is a LIGHT inner ring (#eafffb). It is emitted here
       as the outline-layer mask for geometric completeness, but tinting it with
       the global dark outline default inverts the design intent — left open
       (a per-preset outline default, or outline-off for Soft Halo). -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5"></circle>
</svg>
